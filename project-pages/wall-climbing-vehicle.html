<!-- HTML5 Document -->
<!DOCTYPE html>
<html lang="en">

<!-- Head Tag - contains information about website and where you load CSS and JavaScript files -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panithan | Project Details</title>
    
    <!-- Loading CSS and JavaScript Files -->
    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="stylesheet" href="/stylesheets/navbar.css">
    <link rel="stylesheet" href="/stylesheets/project-detail.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<!-- Body Tag - Main Content in Webpage -->
<body>

    <!-- Navigation Bar -->
    <div id="navbar-placeholder"></div>

    <!-- - - - - - Start of Experiences Page - - - - - - -->
    <main class="main-container">
        
        <!-- - - - - - Project Hero Card - - - - - - -->
        <!-- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -->
        <!-- - - - - - - - - - - - - - - - - - - Project Hero Card - - - - - - - - - - - - - - - - - - - -->
        <!-- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -->
        <div class="project-hero-card">
            <div class="hero-image-canvas">
                <img class="hero-image" src="/assets/projects/Wall Climbing Vehicle.png" alt="Wall Climbing Vehicle">
            </div>

            <div class="hero-project-title">
                <h1 class="project-page-title">
                    Wall Climbing Vehicle
                </h1>
            </div>
    
            <div class="hero-project-description">
                <p class="project-page-description">
                    Designed a wall climbing vehicle with an emphasis on fast production time. 
                </p>
            </div>

            <div class="hero-project-tags">
                <span class="tag">Project</span>
                <span class="tag">Irvine Valley College</span>
            </div>

            <div class="hero-links-segment">
                <a class="project-external-link" href="https://drive.google.com/file/d/1DVKlPpvnrcSbCnFnPm5BlD9Fa7EssXxr/view?usp=sharing" target="_blank">
                    View Full Report
                </a>
                <a class="project-external-link" href="https://cad.onshape.com/documents/ac098b15aba6b6cd4faa88ef/w/829dc90044a9da69a366f6de/e/6efc878ea4d5d33b8d6faa48?renderMode=0&uiState=64714f14a61b1f1bb4221235" target="_blank">
                    View Onshape Model
                </a>
                <a class="project-external-link" href="https://grabcad.com/library/wall-climbing-vehicle-1" target="_blank">
                    GrabCAD Link
                </a>
            </div>
        </div>
        
    </main>

    <footer>
        <p>
        <small>
            &copy; <span id="copyright-year"></span> Panithan Lertsuntivit. 

            Last updated <span id="last-updated"></span>.
        </small>
        </p>
    </footer>

    <!-- Javascript Files -->
    <script src="/scripts/curtain-menu.js"></script>
    <script src="/scripts/update-date.js"></script>
    <script src="/scripts/typing.js"></script>
    <script src="/scripts/fade-in.js"></script>
    <script>
        $(document).ready(function() {
            // Fetch navbar component and replace the placeholder tag
            $.get("/navbar.html", function(data) {
                $("#navbar-placeholder").replaceWith(data);
            });
        });
    </script>
    <!-- Data throttling issue for navigation bar at low speeds -->

</body>
</html>
