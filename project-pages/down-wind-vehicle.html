<!-- HTML5 Document -->
<!DOCTYPE html>
<html lang="en">

<!-- Head Tag - contains information about website and where you load CSS and JavaScript files -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panithan | Project Details</title>
    
    <!-- Loading CSS and JavaScript Files -->
    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="stylesheet" href="/stylesheets/navbar.css">
    <link rel="stylesheet" href="/stylesheets/project-detail.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/icons/Winglet.svg">
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
</head>

<!-- Body Tag - Main Content in Webpage -->
<body>

    <!-- Navigation Bar -->
    <div id="navbar-placeholder"></div>

    <!-- - - - - - Start of Experiences Page - - - - - - -->
    <main class="main-container">
        
        <!-- - - - - - Project Hero Card - - - - - - -->
        <div class="project-hero-card">
            <div class="hero-image-canvas">
                <img class="hero-image" src="/assets/projects/Downwind Vehicle.webp" alt="Downwind Vehicle" loading="lazy">
            </div>

            <div class="hero-project-title">
                <h1 class="project-page-title">
                    Downwind Vehicle
                </h1>
            </div>
    
            <div class="hero-project-description">
                <p class="project-page-description">
                    Redesigned and optimized Derek Muller's Downwind Faster than the Wind vehicle. 
                </p>
            </div>

            <div class="hero-project-tags">
                <span class="tag">Project</span>
                <span class="tag">Irvine Valley College</span>
            </div>

            <div class="hero-links-segment">
                <a class="project-external-link" href="https://drive.google.com/file/d/13ugXKUWC87CLivm3a-7QaQK1smGctiwR/view?usp=sharing" target="_blank">
                    View Full Report
                </a>
                <a class="project-external-link" href="https://cad.onshape.com/documents/61b19276514e44a89ecebf31/w/4d6b0ddab9d2e76bce319e5e/e/9316bf1cc4efb26560d6b268?renderMode=0&uiState=642e51f0d189e05afc94890c" target="_blank">
                    View Onshape Model
                </a>
                <a class="project-external-link" href="https://grabcad.com/library/downwind-vehicle-1" target="_blank">
                    GrabCAD Link
                </a>
            </div>
        </div>
        
    </main>

    <footer>
        <p>
        <small>
            &copy; <span id="copyright-year"></span> Panithan Lertsuntivit. 

            Last updated <span id="last-updated"></span>.
        </small>
        </p>
    </footer>

    <!-- Javascript Files -->
    <script src="/scripts/curtain-menu.js"></script>
    <script src="/scripts/update-date.js"></script>
    <script src="/scripts/typing.js"></script>
    <script src="/scripts/fade-in.js"></script>
    <script>
        // Native Vanilla JS fetch
        document.addEventListener("DOMContentLoaded", () => {
            fetch("/navbar.html")
                .then(response => {
                    if (!response.ok) throw new Error("Navbar network response failed");
                    return response.text();
                })
                .then(data => {
                    const placeholder = document.getElementById("navbar-placeholder");
                    if (placeholder) {
                        // Safely injects the HTML right after the placeholder
                        placeholder.insertAdjacentHTML("afterend", data);
                        // Removes the empty placeholder div to keep the DOM clean
                        placeholder.remove();
                    }
                })
                .catch(error => console.error("Error loading navbar:", error));
        });
    </script>
</body>
</html>
