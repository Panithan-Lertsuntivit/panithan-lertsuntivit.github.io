<!-- HTML5 Document -->
<!DOCTYPE html>
<html lang="en">

<!-- Head Tag - contains information about website and where you load CSS and JavaScript files -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panithan | Project Details</title>
    
    <!-- Loading CSS and JavaScript Files -->
    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="stylesheet" href="/stylesheets/navbar.css">
    <link rel="stylesheet" href="/stylesheets/project-detail.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<!-- Body Tag - Main Content in Webpage -->
<body>

    <!-- Navigation Bar -->
    <div id="navbar-placeholder"></div>

    <!-- - - - - - Start of Experiences Page - - - - - - -->
    <main class="main-container">
        
        <!-- - - - - - Project Hero Card - - - - - - -->
        <!-- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -->
        <!-- - - - - - - - - - - - - - - - - - - Project Hero Card - - - - - - - - - - - - - - - - - - - -->
        <!-- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -->
        <div class="project-hero-card">
            <div class="hero-image-canvas">
                <img class="hero-image" src="/assets/projects/Real-Time Plotter.png" alt="Colored Dog Bones">
            </div>

            <div class="hero-project-title">
                <h1 class="project-page-title">
                    Real-Time Plotter
                </h1>
            </div>
    
            <div class="hero-project-description">
                <p class="project-page-description">
                    Developed a real-time actuation plotter with Internet connectivity.
                </p>
            </div>

            <div class="hero-project-tags">
                <span class="tag">Project</span>
                <span class="tag">Berkeley Engineering</span>
                <span class="tag">ESP-IDF</span>
                <span class="tag">LabVIEW</span>
            </div>

            <div class="hero-links-segment">
                <a class="project-external-link" href="https://drive.google.com/file/d/1kB_r-qsV_3L89Pa1owBfhP-t03mDtzMP/view?usp=sharing" target="_blank">
                    View Full Report
                </a>
                <a class="project-external-link" href="https://github.com/Panithan-Lertsuntivit/real-time-plotter" target="_blank">
                    View GitHub Repository
                </a>
            </div>
        </div>

        <!-- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -->
        <!-- - - - - - - - - - - - - - - - - - - - Image Cards - - - - - - - - - - - - - - - - - - - - - -->
        <!-- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -->
        <div class="image-card">
            <img class="single-image" src="/assets/projects/real-time-plotter/LabVIEW Interface.png" alt="LabVIEW Interface">
            <p class="image-description">
                LabVIEW Graphical User Interface
            </p>
        </div>

        <div class="image-card">
            <img class="single-image" src="/assets/projects/real-time-plotter/Plotter Prototype.png" alt="Plotter Prototype">
            <p class="image-description">
                Plotter Prototype
            </p>
        </div>
        
    </main>

    <footer>
        <p>
        <small>
            &copy; <span id="copyright-year"></span> Panithan Lertsuntivit. 

            Last updated <span id="last-updated"></span>.
        </small>
        </p>
    </footer>

    <!-- Javascript Files -->
    <script src="/scripts/curtain-menu.js"></script>
    <script src="/scripts/update-date.js"></script>
    <script src="/scripts/typing.js"></script>
    <script src="/scripts/fade-in.js"></script>
    <script>
        $(document).ready(function() {
            // Fetch navbar component and replace the placeholder tag
            $.get("/navbar.html", function(data) {
                $("#navbar-placeholder").replaceWith(data);
            });
        });
    </script>
    <!-- Data throttling issue for navigation bar at low speeds -->

</body>
</html>
